name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      - name: ruff (lint)
        run: uv run ruff check app tests

      - name: ruff (format)
        run: uv run ruff format --check app tests

      - name: ty
        run: uv run ty check app
